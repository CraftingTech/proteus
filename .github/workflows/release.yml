name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  github-release:
    name: create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body: |
            ## Proteus ${{ github.ref_name }}

            First-class install path: pin the multi-arch image from GHCR and apply the Kustomize overlay.

            ### Install (Kustomize + GHCR)

            ```bash
            # Recommended: overlay already pins images[].newTag to this release's semver (no leading v)
            kubectl apply -k https://github.com/CraftingTech/proteus.git//deploy/overlays/default?ref=${{ github.ref_name }}
            ```

            Image: `ghcr.io/craftingtech/proteus-controller` — tags include `${{ github.ref_name }}` stripped of the leading `v` (e.g. tag `v0.0.1-alpha.2` → image `…:0.0.1-alpha.2`), plus `{{major}}.{{minor}}` from CI.

            Local clone equivalent:

            ```bash
            git checkout ${{ github.ref_name }}
            kubectl apply -k deploy/overlays/default
            ```

            Details: [`deploy/README.md`](https://github.com/CraftingTech/proteus/blob/${{ github.ref_name }}/deploy/README.md).

            ### MVP capabilities

            - Embedded Dioxus WASM control plane served by the operator
            - CRDs: `ProteusRepository`, `ProteusBackupPolicy`, `ProteusBackup`, `ProteusRestore` (`proteus.io/v1alpha1`)
            - Manual PVC backup / restore against local or S3-compatible repositories
            - Scheduled backups on `ProteusBackupPolicy` (UTC cron, pause/resume, keepLast prune)
            - CAS storage (chunking, BLAKE3, optional AES-256-GCM at rest)
            - Single-cluster operation

            ### Known limits

            - Retention is keepLast only (no TTL yet); large PVCs still use mount-Pod + kube-exec
            - No multi-cluster or cross-cluster migration
            - Restore requires pre-existing target PVCs (same names); no PVC create/resize
            - GHCR package must be **Public** for anonymous cluster pulls
            - Kustomize-only install (no Helm chart)
