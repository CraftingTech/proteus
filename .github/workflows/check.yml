name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: just check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binaryen

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install dioxus-cli
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: dioxus-cli@0.7.9
          locked: true

      - name: just check
        run: just check

  kustomize:
    name: kustomize build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Render install package
        run: kubectl kustomize deploy/overlays/default > /tmp/proteus.yaml

      - name: Sanity check rendered manifests
        run: |
          grep -q 'kind: Deployment' /tmp/proteus.yaml
          grep -q 'ghcr.io/craftingtech/proteus-controller:' /tmp/proteus.yaml
          grep -q 'proteusbackups.proteus.io' /tmp/proteus.yaml

  # Sticky conversation comment so CI result is visible in the PR timeline
  # (Actions check runs alone are easy to miss without required status checks).
  notify:
    name: PR status comment
    if: always() && github.event_name == 'pull_request'
    needs: [check, kustomize]
    runs-on: ubuntu-latest
    steps:
      - name: Post or update CI comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- proteus-ci-status -->';
            const check = '${{ needs.check.result }}';
            const kustomize = '${{ needs.kustomize.result }}';
            const ok = check === 'success' && kustomize === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### CI — `check`',
              '',
              '| Job | Result |',
              '| --- | --- |',
              `| just check | \`${check}\` |`,
              `| kustomize build | \`${kustomize}\` |`,
              '',
              ok
                ? '✅ CI green.'
                : '❌ CI failed — open the workflow run for logs.',
              '',
              `[Workflow run](${runUrl})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
