name: image

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ vars.PROTEUS_IMAGE_NAME || 'craftingtech/proteus-controller' }}

# Native per-arch builds (no QEMU): ubuntu-latest → amd64, ubuntu-24.04-arm → arm64,
# then merge digests into one multi-arch manifest. ARM runners cost more Actions
# minutes but cut wall-clock vs emulated multi-platform builds on a single job.
# Opt in with the repository variable BORINGCACHE_ENABLED=true and BoringCache
# workspace tokens stored as Actions secrets: BORINGCACHE_RESTORE_TOKEN reads;
# BORINGCACHE_SAVE_TOKEN writes on trusted pushes. Otherwise Buildx keeps the
# existing GHA cache for OSS forks and contributors.
# BoringCache owns builder/build/cache/push; Proteus keeps GHCR login, metadata,
# digest artifacts, and the multi-arch manifest merge.

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    env:
      BORINGCACHE_ENABLED: ${{ vars.BORINGCACHE_ENABLED == 'true' && (secrets.BORINGCACHE_RESTORE_TOKEN != '' || (github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN != '')) && 'true' || 'false' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # Bake into CARGO_PKG_VERSION via Dockerfile ARG. Tag push → semver without v;
      # branch/sha builds keep the repo placeholder 0.0.0-dev (no version bump commits).
      - name: Resolve PROTEUS_VERSION
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "proteus_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "proteus_version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: env.BORINGCACHE_ENABLED != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push with BoringCache
        if: env.BORINGCACHE_ENABLED == 'true'
        id: build_boringcache
        uses: boringcache/one@b372edd91cda127cb03c64967df35c3836d47f2a # v1.17.0
        with:
          trust-policy: auto
          setup: none
          mode: docker
          context: .
          dockerfile: deploy/Dockerfile
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PROTEUS_VERSION=${{ steps.ver.outputs.proteus_version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          docker-tool-cache: sccache:proteus-rust-main-image
          docker-mount-cache: true
          fail-on-cache-error: false
          metadata-hints: workflow=image
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN || '' }}

      - name: Build and push with GitHub Actions cache
        if: env.BORINGCACHE_ENABLED != 'true'
        id: build_default
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PROTEUS_VERSION=${{ steps.ver.outputs.proteus_version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=min,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        env:
          IMAGE_DIGEST: ${{ steps.build_boringcache.outputs.digest || steps.build_default.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          digest="$IMAGE_DIGEST"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
