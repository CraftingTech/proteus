apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: proteus-node-agent
rules:
  # Patch own Pod Ready label; create short-lived mover Pods.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  # Mover Pods run in PVC namespaces; provision SA + ClusterRoleBinding there.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["proteus.io"]
    resources:
      - proteusrepositories
      - proteusbackups
      - proteusrestores
    verbs: ["get", "list", "watch"]
  - apiGroups: ["proteus.io"]
    resources:
      - proteusbackups/status
      - proteusrestores/status
    verbs: ["get", "update", "patch"]
