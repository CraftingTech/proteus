apiVersion: apps/v1
kind: Deployment
metadata:
  name: proteus-controller
  namespace: proteus-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proteus
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proteus
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: proteus-controller
      containers:
        - name: controller
          image: ghcr.io/craftingtech/proteus-controller:0.0.1-alpha.2
          imagePullPolicy: IfNotPresent
          env:
            - name: PROTEUS_API_ADDR
              value: "0.0.0.0:8080"
            - name: RUST_LOG
              value: info,proteus_controller=debug,proteus_api=info
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: local-repo
              mountPath: /var/lib/proteus
      volumes:
        - name: local-repo
          emptyDir: {}
