apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: proteus-node-agent
  namespace: proteus-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: proteus
      app.kubernetes.io/component: node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proteus
        app.kubernetes.io/component: node-agent
    spec:
      serviceAccountName: proteus-node-agent
      containers:
        - name: agent
          image: ghcr.io/craftingtech/proteus-controller:main
          imagePullPolicy: IfNotPresent
          args: ["agent"]
          env:
            - name: RUST_LOG
              value: info,proteus_controller=debug
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
