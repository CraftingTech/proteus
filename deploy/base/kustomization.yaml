apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: proteus-system

resources:
  - ns.yaml
  - sa.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - deploy.yaml
  - svc.yaml
  - ../crds

labels:
  - pairs:
      app.kubernetes.io/name: proteus
      app.kubernetes.io/part-of: proteus
    includeSelectors: true
