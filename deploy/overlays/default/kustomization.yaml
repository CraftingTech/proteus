# Tip-of-tree install: pin the GHCR `main` image (updated on every push to main).
# Release installs apply this overlay at a git tag, then override the image to the
# semver tag (no leading "v") — see deploy/README.md and .github/workflows/release.yml.
#   kubectl apply -k deploy/overlays/default
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/craftingtech/proteus-controller
    newTag: "main"
