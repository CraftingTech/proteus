# Sample manifests (not installed by default)

apiVersion: proteus.io/v1alpha1
kind: ProteusRepository
metadata:
  name: local-repo
  namespace: proteus-system
spec:
  description: Local CAS store for development
  encryptionEnabled: false
  backend:
    type: local
    path: /var/lib/proteus/repo
---
apiVersion: proteus.io/v1alpha1
kind: ProteusBackupPolicy
metadata:
  name: demo-ns-daily
  namespace: proteus-system
spec:
  repositoryRef: local-repo
  targetNamespace: demo
  pvcNames:
    - demo-data
  schedule: "0 2 * * *"
  includeVolumes: true
  retention:
    keepLast: 7
    maxAgeDays: 30
---
# One run of the policy above (created by UI "Run now" or manually).
apiVersion: proteus.io/v1alpha1
kind: ProteusBackup
metadata:
  name: demo-ns-daily-run
  namespace: proteus-system
spec:
  policyRef: demo-ns-daily
---
apiVersion: proteus.io/v1alpha1
kind: ProteusRestore
metadata:
  name: demo-ns-restore
  namespace: proteus-system
spec:
  backupRef: demo-ns-daily-run
  targetNamespace: demo-restored
  overwrite: false
