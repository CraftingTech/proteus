# Proteus install via Kustomize
#
#   kubectl apply -k deploy/kustomize/overlays/default
#
# Or build/push the image first:
#   docker build -f deploy/Dockerfile -t ghcr.io/craftingtech/proteus-controller:0.1.0 .
#   kubectl apply -k deploy/kustomize/overlays/default

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: proteus-system

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - deployment.yaml
  - service.yaml
  - ../crds

labels:
  - pairs:
      app.kubernetes.io/name: proteus
      app.kubernetes.io/part-of: proteus
    includeSelectors: true
