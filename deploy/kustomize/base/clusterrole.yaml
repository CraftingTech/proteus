apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: proteus-controller
rules:
  - apiGroups: ["proteus.io"]
    resources:
      - proteusrepositories
      - proteusbackups
      - proteusrestores
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["proteus.io"]
    resources:
      - proteusrepositories/status
      - proteusbackups/status
      - proteusrestores/status
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  # Secrets: read for S3 probe; create/update for UI-provided credentials.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
