workspace = "craftingtech/proteus"

[proxy]
metadata-hints = ["project=proteus"]

[adapters.docker]
tag = "proteus-image-main"
metadata-hints = ["tool=oci", "lane=image"]

[adapters.sccache]
tag = "proteus-rust-main-check"
metadata-hints = ["tool=sccache", "lane=check"]

[entries.cargo-target]
tag = "proteus-rust-main-check-target"

[entries.cargo-registry]
tag = "proteus-rust-main-check-registry"

[entries.cargo-git]
tag = "proteus-rust-main-check-git"

[profiles.check]
entries = ["cargo-target", "cargo-registry", "cargo-git"]
